<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Still Ripples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #1a1228;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .back-home {
      position: fixed; top: 18px; left: 18px; z-index: 20;
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      color: rgba(255,255,255,.7);
      background: rgba(255,255,255,.1);
      box-shadow: 0 14px 30px rgba(0,0,0,.3);
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .back-home svg {
      width: 21px; height: 21px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
    }

    .hint {
      position: fixed; left: 50%; bottom: clamp(52px, 9vh, 90px);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      transition: opacity .6s ease;
    }
    .hint h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 600; line-height: 1;
      color: rgba(255,255,255,.85);
    }
    .hint p {
      margin-top: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 300; line-height: 1.6;
      color: rgba(255,255,255,.45);
    }
    .hint.hidden { opacity: 0; }
  </style>
  <link rel="stylesheet" href="../aemona-embedded.css?v=20260611-2">
</head>
<body class="tool-inner-hear">
  <a class="back-home" href="../index.html" aria-label="Back to tools">
    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
  </a>

  <canvas id="c"></canvas>

  <div class="hint" id="hint">
    <h1>Still Ripples</h1>
    <p>Touch to release.<br>Watch each feeling spread and fade.</p>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    let ripples = [];
    let touched = false;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Palette: deep purple to soft lavender tones
    const COLORS = [
      [180, 130, 220],  // lavender
      [140, 100, 200],  // violet
      [200, 160, 240],  // light purple
      [120, 170, 220],  // periwinkle blue
      [220, 170, 200],  // rose lavender
    ];

    function addRipple(x, y) {
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      ripples.push({
        x, y,
        r: 0,
        maxR: Math.min(canvas.width, canvas.height) * (0.55 + Math.random() * 0.25),
        color,
        alpha: 0.72,
        speed: 1.8 + Math.random() * 1.2,
        rings: Math.floor(2 + Math.random() * 2)
      });
      if (!touched) {
        touched = true;
        hint.classList.add('hidden');
      }
    }

    function draw(ts) {
      requestAnimationFrame(draw);

      // Fade background
      ctx.fillStyle = 'rgba(26,18,40,0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ripples = ripples.filter(rp => rp.alpha > 0.01);

      for (const rp of ripples) {
        rp.r   += rp.speed;
        rp.alpha *= 0.978;

        for (let ring = 0; ring < rp.rings; ring++) {
          const ro = ring * 22;
          const r  = Math.max(0, rp.r - ro);
          if (r <= 0) continue;
          const fade = Math.max(0, rp.alpha * (1 - ring * 0.28));
          if (fade < 0.01 || r > rp.maxR) continue;

          const edgeFade = 1 - (r / rp.maxR);
          const a = fade * edgeFade;

          ctx.beginPath();
          ctx.arc(rp.x, rp.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(${rp.color[0]},${rp.color[1]},${rp.color[2]},${a})`;
          ctx.lineWidth   = Math.max(0.5, 2.2 * edgeFade);
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);

    function onTouch(e) {
      e.preventDefault();
      const touches = e.changedTouches || [e];
      for (const t of touches) {
        const rect = canvas.getBoundingClientRect();
        addRipple(t.clientX - rect.left, t.clientY - rect.top);
      }
    }

    canvas.addEventListener('touchstart',  onTouch, { passive: false });
    canvas.addEventListener('touchmove',   onTouch, { passive: false });
    canvas.addEventListener('pointerdown', onTouch);
  </script>
</body>
</html>
