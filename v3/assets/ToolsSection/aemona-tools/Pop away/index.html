<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pop Away</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .back-home {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #6C4F88;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 14px 30px rgba(108, 79, 136, .13);
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .back-home svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

</head>

<body class="tool-pop">

  <a class="back-home" href="../index.html" aria-label="Back to tools">
    <svg viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"></path>
    </svg>
  </a>

  <main class="pop-page">

    <header class="hero">

      <h1>Pop Away</h1>

      <p class="subtitle">
        Pressure has a shape, too.
      </p>

    </header>

    <div class="canvas-hint">
      <span class="hint-dot"></span>
      Hold a bubble to squeeze it
    </div>

    <!-- 作者原来的 p5 Canvas 会自动生成在这里 -->

    <section id="canvas-wrapper" aria-label="Pop Away interaction"></section>

    <section class="reflection">

      <p>
        Sometimes stress
        <br>
        doesn't arrive as words.
        <br>
        It gathers quietly,
        <br>
        waiting for somewhere
        <br>
        to go.
      </p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>

  <script src="sketch.js"></script>

</body>

</html>
