<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Flush the Negative</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F9F7F3;
      --ink: #513D35;
      --title: #6C4F88;
      --soft-ink: rgba(81, 61, 53, .58);
      --muted: rgba(81, 61, 53, .42);
      --line: rgba(81, 61, 53, .1);
      --surface: rgba(255, 255, 255, .56);
      --accent: #A46E58;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .flush-page {
      width: min(100%, 430px);
      min-height: 100dvh;
      padding: 36px 22px 22px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: var(--bg);
    }

    .back-home {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--title);
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 14px 30px rgba(108, 79, 136, .13);
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .back-home svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero {
      padding: 0 18px;
    }

    h1 {
      font-family: "Ibarra Real Nova", serif;
      font-size: 44px;
      line-height: .98;
      font-weight: 500;
      color: var(--title);
      letter-spacing: 0;
    }

    .subtitle {
      width: 260px;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--soft-ink);
    }

    .ritual-shell {
      margin-top: 22px;
      height: clamp(440px, 64dvh, 610px);
      min-height: 440px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }

    .release-stage {
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(255,255,255,.52), rgba(249,247,243,.9));
    }

    .release-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .canvas-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blinkDot 2.2s ease-in-out infinite;
    }

    @keyframes blinkDot {
      0%, 100% {
        opacity: .22;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.38);
      }
    }

    .reflection {
      margin-top: 20px;
      padding: 0 26px;
      text-align: center;
    }

    .reflection p {
      font-size: 14px;
      line-height: 1.75;
      font-weight: 300;
      color: rgba(81, 61, 53, .64);
    }

    .value {
      margin: 16px auto 0;
      width: min(100%, 318px);
      padding: 12px 18px 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
      font-size: 12px;
      line-height: 1.65;
      font-weight: 300;
      color: rgba(81, 61, 53, .48);
    }

    @media (max-height: 760px) {
      .flush-page {
        padding-top: 34px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        margin-top: 14px;
      }

      .ritual-shell {
        margin-top: 18px;
        height: clamp(360px, 58dvh, 500px);
        min-height: 360px;
      }

      .reflection {
        margin-top: 22px;
      }
    }
  </style>

</head>

<body>

  <a class="back-home" href="../index.html" aria-label="Back to tools">
    <svg viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"></path>
    </svg>
  </a>

  <main class="flush-page">

    <header class="hero">

      <h1>Flush the<br>Negative</h1>

      <p class="subtitle">
        Some thoughts only need somewhere to go.
      </p>

    </header>

    <section class="ritual-shell" aria-label="Flush the Negative interaction">
      <div class="release-stage">
        <iframe
          class="release-frame"
          src="https://gappso.cn/api/apps/let-it-go/run?v=1780511114836"
          title="Let it go interaction"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; microphone; camera; web-share"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <div class="canvas-hint">
      <span class="hint-dot"></span>
      Type it, release it, let the page carry it away
    </div>

    <section class="reflection">

      <p>
        What feels heavy
        <br>
        can become motion.
      </p>

    </section>

    <section class="value">
      A small ritual for letting difficult thoughts move through.
    </section>

  </main>

</body>

</html>
